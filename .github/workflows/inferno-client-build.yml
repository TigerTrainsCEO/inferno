name: Build Inferno Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.10", "1.21.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Resolve Fabric versions
        id: v
        run: |
          MC="${{ matrix.mc }}"
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          API=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "MC=$MC loader=$LOADER yarn=$YARN api=$API"
          test -n "$LOADER" && test -n "$YARN" && test -n "$API"

      - name: Build
        working-directory: inferno-client
        run: >
          gradle build --no-daemon --stacktrace
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ steps.v.outputs.yarn }}
          -Ploader_version=${{ steps.v.outputs.loader }}
          -Pfabric_api_version=${{ steps.v.outputs.api }}

      - uses: actions/upload-artifact@v4
        with:
          name: inferno-client-${{ matrix.mc }}
          path: |
            inferno-client/build/libs/inferno-client-*.jar
            !inferno-client/build/libs/*-sources.jar
