name: Build Inferno Launcher
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
 
env:
  TURBO_TELEMETRY_DISABLED: 1
 
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
 
      - uses: pnpm/action-setup@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
 
      - uses: dtolnay/rust-toolchain@stable
 
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
 
      - name: Configure endpoints and generate i18n coverage
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env
          pnpm i18n:coverage
 
      - name: Run PvP profile tests
        shell: bash
        run: |
          cd apps/app-frontend
          npx esbuild tests/pvp.test.ts --bundle --platform=node --format=cjs --outfile=pvp.test.cjs --log-level=warning
          node --test pvp.test.cjs
 
      - name: Build installer
        run: pnpm --filter @modrinth/app build
 
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-launcher-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
 
